<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="ht hd">
  <title id="ht">Claude Mods Brain</title>
  <desc id="hd">A second brain for Claude Code mods: notes on events, the mods API, safety, the catalog, flows, canon, sources and pitfalls orbit the title.</desc>
  <style>
    .cm-draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: cmdraw 1.6s ease-out both; }
    .cm-trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: cmdraw 2.4s 0.5s ease-in-out both; }
    .cm-pop { transform-box: fill-box; transform-origin: center; animation: cmpop 0.7s ease-out both; }
    .cm-in { animation: cmin 0.9s ease-out both; }
    .cm-rise { animation: cmrise 1.6s 0.2s ease-out both; }
    .cm-rise2 { animation: cmrise 1.6s 0.6s ease-out both; }
    .cm-rise3 { animation: cmrise 1.6s 0.9s ease-out both; }
    .cm-tw { animation: cmtw 5s ease-in-out infinite; }
    @keyframes cmdraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes cmpop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes cmin { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cmrise { from { opacity: 0; transform: translateY(12px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes cmtw { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cm-draw, .cm-trace, .cm-pop, .cm-in, .cm-rise, .cm-rise2, .cm-rise3, .cm-tw { animation: none; }
    }
  </style>
  <defs>
    <path id="cmOuter" d="M85 360 A555 305 0 1 1 1195 360 A555 305 0 1 1 85 360 Z"></path>
    <path id="cmInner" d="M190 360 A450 225 0 1 1 1090 360 A450 225 0 1 1 190 360 Z"></path>
    <mask id="cmTrackMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
      <path class="cm-trace" pathLength="1" d="M85 360 A555 305 0 1 1 1195 360 A555 305 0 1 1 85 360 Z" fill="none" stroke="#fff" stroke-width="12"></path>
      <path class="cm-trace" pathLength="1" d="M190 360 A450 225 0 1 1 1090 360 A450 225 0 1 1 190 360 Z" fill="none" stroke="#fff" stroke-width="12" style="animation-delay: 0.8s"></path>
    </mask>
    <linearGradient id="cmShine" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#FAF9F5"></stop>
      <stop offset="0.4" stop-color="#FAF9F5"></stop>
      <stop offset="0.5" stop-color="#E8987A"></stop>
      <stop offset="0.6" stop-color="#FAF9F5"></stop>
      <stop offset="1" stop-color="#FAF9F5"></stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 900 0; 900 0" keyTimes="0; 0.4; 1" dur="6s" begin="2s" repeatCount="indefinite"></animateTransform>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#191917"></rect>

  <g stroke="#3a3833" stroke-width="1" fill="none">
    <path class="cm-draw" pathLength="1" d="M44 44 L140 30"></path>
    <path class="cm-draw" pathLength="1" d="M44 44 L30 128" style="animation-delay: 0.2s"></path>
    <path class="cm-draw" pathLength="1" d="M1236 44 L1140 30" style="animation-delay: 0.1s"></path>
    <path class="cm-draw" pathLength="1" d="M1236 44 L1250 128" style="animation-delay: 0.3s"></path>
    <path class="cm-draw" pathLength="1" d="M44 676 L140 690" style="animation-delay: 0.15s"></path>
    <path class="cm-draw" pathLength="1" d="M44 676 L30 592" style="animation-delay: 0.35s"></path>
    <path class="cm-draw" pathLength="1" d="M1236 676 L1140 690" style="animation-delay: 0.25s"></path>
    <path class="cm-draw" pathLength="1" d="M1236 676 L1250 592" style="animation-delay: 0.45s"></path>
  </g>
  <g fill="#6f6c64">
    <circle class="cm-pop" cx="44" cy="44" r="3.5"></circle>
    <circle class="cm-pop" cx="140" cy="30" r="3" style="animation-delay: 0.3s"></circle>
    <circle class="cm-pop" cx="30" cy="128" r="3" style="animation-delay: 0.4s"></circle>
    <circle class="cm-pop" cx="1236" cy="44" r="3.5" style="animation-delay: 0.2s"></circle>
    <circle class="cm-pop" cx="1140" cy="30" r="3" style="animation-delay: 0.4s"></circle>
    <circle class="cm-pop" cx="1250" cy="128" r="3" style="animation-delay: 0.5s"></circle>
    <circle class="cm-pop" cx="44" cy="676" r="3.5" style="animation-delay: 0.25s"></circle>
    <circle class="cm-pop" cx="140" cy="690" r="3" style="animation-delay: 0.45s"></circle>
    <circle class="cm-pop" cx="30" cy="592" r="3" style="animation-delay: 0.55s"></circle>
    <circle class="cm-pop" cx="1236" cy="676" r="3.5" style="animation-delay: 0.35s"></circle>
    <circle class="cm-pop" cx="1140" cy="690" r="3" style="animation-delay: 0.5s"></circle>
    <circle class="cm-pop" cx="1250" cy="592" r="3" style="animation-delay: 0.6s"></circle>
  </g>

  <g mask="url(#cmTrackMask)" fill="none" stroke="#3a3833" stroke-width="1.3" stroke-dasharray="2 7">
    <use href="#cmOuter" xlink:href="#cmOuter"></use>
    <use href="#cmInner" xlink:href="#cmInner"></use>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <g class="cm-in" style="animation-delay: 2.2s">
      <g><circle class="cm-pop" r="15" fill="#D97757" fill-opacity="0.16" style="animation-delay: 2.2s"></circle><circle class="cm-pop" r="6" fill="#D97757" style="animation-delay: 2.2s"></circle><text y="-18" fill="#e6e1d6">events</text><animateMotion dur="60s" repeatCount="indefinite" begin="0s"><mpath href="#cmOuter" xlink:href="#cmOuter"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 2.4s">
      <g><circle class="cm-pop" r="15" fill="#D97757" fill-opacity="0.16" style="animation-delay: 2.4s"></circle><circle class="cm-pop" r="6" fill="#D97757" style="animation-delay: 2.4s"></circle><text y="-18" fill="#e6e1d6">$ api</text><animateMotion dur="60s" repeatCount="indefinite" begin="-15s"><mpath href="#cmOuter" xlink:href="#cmOuter"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 2.6s">
      <g><circle class="cm-pop" r="15" fill="#D97757" fill-opacity="0.16" style="animation-delay: 2.6s"></circle><circle class="cm-pop" r="6" fill="#D97757" style="animation-delay: 2.6s"></circle><text y="-18" fill="#e6e1d6">safety</text><animateMotion dur="60s" repeatCount="indefinite" begin="-30s"><mpath href="#cmOuter" xlink:href="#cmOuter"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 2.8s">
      <g><circle class="cm-pop" r="15" fill="#D97757" fill-opacity="0.16" style="animation-delay: 2.8s"></circle><circle class="cm-pop" r="6" fill="#D97757" style="animation-delay: 2.8s"></circle><text y="-18" fill="#e6e1d6">catalog</text><animateMotion dur="60s" repeatCount="indefinite" begin="-45s"><mpath href="#cmOuter" xlink:href="#cmOuter"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 3.0s">
      <g><circle class="cm-pop" r="4.5" fill="#8a867c" style="animation-delay: 3.0s"></circle><text y="-13" fill="#a6a39a">flows</text><animateMotion dur="60s" repeatCount="indefinite" begin="-7.5s"><mpath href="#cmInner" xlink:href="#cmInner"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 3.15s">
      <g><circle class="cm-pop" r="4.5" fill="#8a867c" style="animation-delay: 3.15s"></circle><text y="-13" fill="#a6a39a">canon</text><animateMotion dur="60s" repeatCount="indefinite" begin="-22.5s"><mpath href="#cmInner" xlink:href="#cmInner"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 3.3s">
      <g><circle class="cm-pop" r="4.5" fill="#8a867c" style="animation-delay: 3.3s"></circle><text y="-13" fill="#a6a39a">sources</text><animateMotion dur="60s" repeatCount="indefinite" begin="-37.5s"><mpath href="#cmInner" xlink:href="#cmInner"></mpath></animateMotion></g>
    </g>
    <g class="cm-in" style="animation-delay: 3.45s">
      <g><circle class="cm-pop" r="4.5" fill="#8a867c" style="animation-delay: 3.45s"></circle><text y="-13" fill="#a6a39a">pitfalls</text><animateMotion dur="60s" repeatCount="indefinite" begin="-52.5s"><mpath href="#cmInner" xlink:href="#cmInner"></mpath></animateMotion></g>
    </g>
  </g>

  <text class="cm-rise" x="640" y="298" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.3" fill="#8a867c">CLAUDE CODE MODS · SECOND BRAIN</text>
  <text class="cm-rise2" x="640" y="380" text-anchor="middle" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="url(#cmShine)">Claude Mods Brain</text>
  <g class="cm-rise3" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c9c4b8" text-anchor="middle">
    <text x="640" y="422">Linked notes on how mods work, how to build them,</text>
    <text x="640" y="448">and how to check one before you install it.</text>
  </g>
</svg>
