<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">Claude Mods Brain</title>
  <desc id="d">A calm terminal window. A small mod pane sits beside the conversation and a one-line mod band sits above the prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1d"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- title -->
  <text x="80" y="226" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#f2efe9">Claude Mods Brain</text>
  <text x="80" y="274" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a8a29a">Learn, build, and check Claude Code mods.</text>
  <text x="80" y="308" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#a8a29a">Every claim linked to its source.</text>
  <rect x="80" y="344" width="56" height="4" rx="2" fill="#d97757"/>

  <!-- terminal window -->
  <g transform="translate(664 96)">
    <rect width="560" height="368" rx="14" fill="#1e1e20" stroke="#34343a"/>
    <circle cx="24" cy="22" r="6" fill="#3a3a40"/><circle cx="44" cy="22" r="6" fill="#3a3a40"/><circle cx="64" cy="22" r="6" fill="#3a3a40"/>
    <line x1="0" y1="44" x2="560" y2="44" stroke="#2c2c31"/>

    <!-- conversation -->
    <g font-family="Menlo, Consolas, monospace" font-size="15">
      <text x="24" y="84" fill="#d97757">&gt;</text>
      <text x="42" y="84" fill="#e8e4dc">add a guard for rm -rf</text>
      <rect x="24" y="104" width="250" height="8" rx="4" fill="#3a3a40"/>
      <rect x="24" y="122" width="210" height="8" rx="4" fill="#3a3a40"/>
      <rect x="24" y="140" width="232" height="8" rx="4" fill="#3a3a40"/>
      <rect x="24" y="170" width="190" height="8" rx="4" fill="#3a3a40"/>
      <rect x="24" y="188" width="226" height="8" rx="4" fill="#3a3a40"/>
    </g>

    <!-- mod pane -->
    <g transform="translate(300 64)">
      <rect width="236" height="176" rx="10" fill="#232327" stroke="#3d4a5c"/>
      <text x="16" y="28" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#8fb3e0">my-mod</text>
      <text x="200" y="28" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6c6c74">pane</text>
      <g font-family="Menlo, Consolas, monospace" font-size="13">
        <text x="16" y="62" fill="#7cc49a">&#10003;</text><text x="36" y="62" fill="#c9c4bb">tests pass</text>
        <text x="16" y="88" fill="#7cc49a">&#10003;</text><text x="36" y="88" fill="#c9c4bb">no secrets read</text>
        <text x="16" y="114" fill="#d97757">!</text><text x="36" y="114" fill="#c9c4bb">1 call held</text>
      </g>
      <rect x="16" y="136" width="96" height="26" rx="6" fill="#2f3b4b"/>
      <text x="64" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#cfe0f5">approve</text>
      <rect x="122" y="136" width="96" height="26" rx="6" fill="#2b2b30"/>
      <text x="170" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#a8a29a">deny</text>
    </g>

    <!-- mod band above prompt -->
    <rect x="24" y="278" width="512" height="28" rx="6" fill="#262b33"/>
    <text x="38" y="297" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8fb3e0">band</text>
    <text x="84" y="297" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c9c4bb">context 31%</text>
    <rect x="196" y="288" width="140" height="8" rx="4" fill="#3a3a40"/>
    <rect x="196" y="288" width="44" height="8" rx="4" fill="#7cc49a"/>

    <!-- prompt -->
    <rect x="24" y="318" width="512" height="32" rx="8" fill="#19191b" stroke="#3a3a40"/>
    <text x="40" y="339" font-family="Menlo, Consolas, monospace" font-size="15" fill="#d97757">&gt;</text>
    <rect x="58" y="327" width="9" height="16" fill="#e8e4dc" opacity="0.85"/>
  </g>
</svg>
