name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python -m compileall -q scripts mods_brain tests
      - run: python tests/test_adapters.py
      - run: python scripts/lint_vault.py --vault .
      - run: python scripts/check_no_em_dash.py
      - run: python scripts/check_source_ids.py
      - run: python -m mods_brain.cli --help
